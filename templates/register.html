{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <div class="card shadow-sm"><div class="card-body">
    <h4 class="mb-3">Create account</h4>
    <form method="post">
      <input class="form-control mb-3" name="username" placeholder="Username (3+ characters)" required>
      <input class="form-control mb-3" type="password" name="password" placeholder="Password (6+ characters)" required>
      <button class="btn btn-success w-100">Register</button>
    </form>
    <p class="mt-3 mb-0">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
  </div></div>
</div></div>
{% endblock %}
